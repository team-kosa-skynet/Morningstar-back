name: Project CI/CD with Docker

on:
  push:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  # 1. Docker 이미지를 빌드하고 Docker Hub에 푸시하는 잡
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/project:latest

  # 2. EC2에 배포하는 잡
  deploy:
      needs: build-and-push-docker-image
      runs-on: ubuntu-latest
      if: github.event_name == 'push'
      steps:
        - name: Checkout
          uses: actions/checkout@v3

        - name: Copy docker-compose.yml to EC2
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ec2-user
            key: ${{ secrets.EC2_SSH_KEY }}
            source: "docker-compose-prod.yml" # ✅ 1. 파일 이름 수정
            target: "/home/ec2-user/Morningstar-back"

        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ec2-user
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              cd /home/ec2-user/Morningstar-back

              echo "🐳 Docker Hub에서 최신 이미지를 가져옵니다..."
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/project:latest

              echo "🚀 Docker Compose로 애플리케이션을 배포합니다..."
              # ✅ 2. 모든 docker-compose 명령어에 -f 옵션 추가
              docker-compose -f docker-compose-prod.yml up -d

              docker image prune -af

              sleep 5
              echo "✅ 배포된 컨테이너 상태를 확인합니다:"
              docker-compose -f docker-compose-prod.yml ps

              echo "📄 최신 로그 20줄을 확인합니다:"
              docker-compose -f docker-compose-prod.yml logs --tail=20